[package]
name = "kiroku"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "A daily terminal work log with human-readable monthly Markdown files"

[[bin]]
name = "krk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.9"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", features = ["pty"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
